[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onboard"
version = "0.1.0"
description = "LLM-assisted data onboarding for enterprise systems (CMMS migration as the worked example)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Huw01" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "faker>=25.0",
    "typer>=0.12",
    "openpyxl>=3.1",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
docs = ["matplotlib>=3.8"]

[project.scripts]
onboard = "onboard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/onboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
